<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
<h1>Mini Calculator</h1>
<div class="row"><input id="a" type="number" aria-label="First number" value="6"><select id="op" aria-label="Operation"><option>+</option><option>-</option><option>*</option><option>/</option></select><input id="b" type="number" aria-label="Second number" value="7"></div><div class="row"><button id="go">Calculate</button></div><p class="big" id="out">&nbsp;</p>
<p class="tag">Styled after 2020 web trends: Neumorphism</p>
</main>
<script src="script.js"></script>
</body>
</html>
